name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ESPHome is pinned: this component reaches into esp32 codegen helpers and the
# automation API, both of which move between releases. Bump it deliberately,
# never with a range.
env:
  ESPHOME_VERSION: "2026.9.0"
  BUILD_NAME: usb-boot-keyboard-ci
  EXPECTED_FLASH_SIZE: "4MB"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ESPHome manages ESP-IDF itself under ~/.cache/esphome (frameworks, tools,
      # python envs). There is no PlatformIO in this build at all.
      - name: Cache the ESP-IDF toolchain and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.cache/pip
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ hashFiles('example/ci.yaml') }}
          restore-keys: esphome-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Validate
        run: esphome config example/ci.yaml

      - name: Compile
        run: esphome compile example/ci.yaml

      - name: Collect and verify the images
        run: |
          set -euo pipefail
          # The native-IDF build writes here, next to the config it built.
          # (.pioenvs was the old PlatformIO layout and no longer exists.)
          BUILD_DIR="example/.esphome/build/${BUILD_NAME}/build"
          ls -l "${BUILD_DIR}"/firmware.*.bin
          mkdir -p dist
          cp "${BUILD_DIR}/firmware.factory.bin" dist/firmware-merged.bin
          cp "${BUILD_DIR}/firmware.ota.bin" dist/firmware-ota.bin
          python3 .github/scripts/check_flash_size.py dist/firmware-merged.bin "${EXPECTED_FLASH_SIZE}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Source-only release: no firmware is published. A prebuilt image would
      # have to carry a baked API key, and this device injects keystrokes into
      # whatever it is plugged into. Users compile their own with their own key.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

